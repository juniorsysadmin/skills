[package]
name = "aws_pricing"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-config = { version = "=1.10.0", features = ["credentials-login"] }
aws-sdk-pricing = "=1.108.0"
aws-smithy-types = "=1.6.1"
clap = { version = "=4.6.4", features = ["derive"] }
regex = "=1.13.1"
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt"] }

[profile.release]
strip = true
